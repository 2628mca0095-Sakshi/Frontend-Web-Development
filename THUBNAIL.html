<!DOCTYPE html>
<html>
<head>
    <title>Interactive Image Gallery</title>
</head>
<body>

    <h1>Interactive Image Gallery</h1>

    <h3 id="imageTitle">Image 1</h3>
    <img id="mainImage" src="" width="400" height="250" alt="Main Image">

    <br><br>

    <button onclick="previousImage()">Previous</button>
    <button onclick="nextImage()">Next</button>

    <h3>Image Thumbnails</h3>

    <div id="thumbnails"></div>

    <script>
        
        let images = [
            {
                title: "Mountain",
                src: "https://picsum.photos/id/1018/400/250"
            },
            {
                title: "Nature",
                src: "https://picsum.photos/id/1015/400/250"
            },
            {
                title: "Sky",
                src: "https://picsum.photos/id/1019/400/250"
            },
            {
                title: "Lake",
                src: "https://picsum.photos/id/1020/400/250"
            }
        ];

        let currentIndex = 0;

        function displayImage(index) {
            currentIndex = index;

            document.getElementById("mainImage").src =
                images[currentIndex].src;

            document.getElementById("imageTitle").innerHTML =
                images[currentIndex].title;

            let thumbnails = document.querySelectorAll(".thumbnail");

            thumbnails.forEach(function(img, i) {
                if (i === currentIndex) {
                    img.style.border = "4px solid blue";
                } else {
                    img.style.border = "4px solid transparent";
                }
            });
        }

        
        function createThumbnails() {
            let container = document.getElementById("thumbnails");

            for (let i = 0; i < images.length; i++) {
                let img = document.createElement("img");

                img.src = images[i].src;
                img.width = 100;
                img.height = 70;
                img.alt = images[i].title;
                img.className = "thumbnail";

                img.onclick = function() {
                    displayImage(i);
                };

                container.appendChild(img);
            }

            displayImage(0);
        }

        function nextImage() {
            currentIndex++;

            if (currentIndex >= images.length) {
                currentIndex = 0;
            }

            displayImage(currentIndex);
        }

        
        function previousImage() {
            currentIndex--;

            if (currentIndex < 0) {
                currentIndex = images.length - 1;
            }

            displayImage(currentIndex);
        }

        
        createThumbnails();
    </script>

</body>
</html>
