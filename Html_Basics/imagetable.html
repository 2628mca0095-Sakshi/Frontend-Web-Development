<!DOCTYPE html>
<html>
<head>
    <title>My Web Page</title>
</head>

<body>

<table border="1">

    <!-- Top Row -->
    <tr>
        <td colspan="3" height="150px" align="center">
            <img src="image (3).jpg">
            
        </td>
    </tr>

    <!-- Middle Row -->
    <tr>

        <!-- Left Side Links -->
        <td rowspan="2" width="150px" align="center">

            <a href="https://www.google.com">Google</a>
            <br><br>

            <a href="https://www.youtube.com">YouTube</a>
            <br><br>

            <a href="https://www.wikipedia.org">Wikipedia</a>
            <br><br>

            <a href="https://www.github.com">GitHub</a>
            <br><br>

            <a href="https://www.linkedin.com">LinkedIn</a>

        </td>

        <!-- Middle Text -->
        <td width="450px" align="center">
            Text about the image above
        </td>

        <!-- Right Login Table -->
        <td width="200px">

            <table border="1" width="100%">

                <tr>
                    <td>ID</td>
                    <td>
                        <input type="text">
                    </td>
                </tr>

                <tr>
                    <td>PWD</td>
                    <td>
                        <input type="password">
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Submit">
                    </td>
                </tr>

            </table>

        </td>

    </tr>

    <!-- Bottom Row -->
    <tr>
        <td colspan="2" height="200px" align="center">
            Image 600px X 200px
        </td>
    </tr>

</table>

</body>
</html>
