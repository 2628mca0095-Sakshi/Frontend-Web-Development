<!DOCTYPE html>
<html>
<head>
    <title>Merge Two Arrays</title>
</head>

<body>

    <h2>Merge Two Arrays Using Spread Operator</h2>

    <script>

        let arr1 = [10, 20, 30, 40];

        let arr2 = [50, 60, 70, 80];

        let arr3 = [...arr1, ...arr2];

        

        console.log("First Array:", ...arr1);

        console.log("Second Array:", ...arr2);

        console.log("Merged Array:", ...arr3);

    </script>

</body>
</html>
