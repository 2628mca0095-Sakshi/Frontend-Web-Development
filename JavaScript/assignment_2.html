<!DOCTYPE html>
<html>
<head>
    <title>Working with Variables</title>
</head>
<body>

    <h2>Working with Variables</h2>

    <script>
        let name = "Sakshi";
        let age = 21;
        let course = "MCA";
        let isStudent = true;

        console.log("Name:", name);
        console.log("Age:", age);
        console.log("Course:", course);
        console.log("Is Student:", isStudent);

        console.log("Data type of name:", typeof name);
        console.log("Data type of age:", typeof age);
        console.log("Data type of course:", typeof course);
        console.log("Data type of isStudent:", typeof isStudent);
    </script>
</body>
</html>
