<!DOCTYPE html>
<html>
<head>
    <title>Basic Arithmetic Operations</title>
</head>
<body>

    <h2>Basic Arithmetic Operations</h2>

    <script>
        let a = 20;
        let b = 6;
        console.log("Sum:", a + b);
        console.log("Difference:", a - b);
        console.log("Product:", a * b);
        console.log("Division:", a / b);
        console.log("Remainder:", a % b);
    </script>
</body>
</html>
