<!DOCTYPE html>
<html>
<head>
    <title>Arrow Function</title>
</head>
<body>

    <script>

        const sum = (...numbers) => {

            let total = numbers.reduce((a, b) => a + b);

            return total;
        };

        console.log(sum(10, 20, 30, 40, 50, 60, 70, 80, 90));

        console.log(sum(10, 20, 30, 40, 50, 60, 70, 80, 90, 1000, 3333, 266262, 77788));

        console.log(sum(10, 20));

    </script>

</body>
</html>
