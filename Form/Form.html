<!DOCTYPE html>
<html>
    <head>
        <title>STUDENT INFORMATION FORM</title>
    </head>
    
    <body>
        <h2>STUDENT INFORMATION FORM</h2>

        <form>
            <label>NAME:</label>
            <input type="text" id="name" >
             <br><br>
             
             <label>E-Mail:</label>
             <input type="email" id="email">
             <br><br>

             <label>PASSWORD:</label>
             <input type="password" id="password">
             <br><br>

             <label>AGE:</label>
             <input type="number" id="age">
             <br><br>

             <label>CONTACT:</label>
             <input type="tel" id="contact" maxlength="10">
             <br><br>

             <label>Gender:</label>
             <input type="radio" name="gender" value="Male"> Male
             <input type="radio" name="gender" value="Female"> Female
             <input type="radio" name="gender" value="Other"> Other 
             <br><br>

             <label>TECHNOLOGY SKILLS:</label>
             <br><br>
             <input type="checkbox" name="skills" value="HTML">HTML
             <input type="checkbox" name="skills" value="CSS">CSS
             <input type="checkbox" name="skills" value="JAVA SCRIPT">JAVA SCRIPT
             <input type="checkbox" name="skills" value="PYTHON">PYTHON
             <input type="checkbox" name="skills" value="JAVA">JAVA
             <br><br>

             <label>COURSE:</label>
             <select id="course">
                <option>Select Course</option>
                <option value= "MCA">MCA</option>
                <option value= "BCA">BCA</option>
                <option value= "B-TECH">B-TECH</option>
                <option value= "MBA">MBA</option>
             </select>
             <br><br>

             <label>Preferred Language:</label>
             <select id="language"  multiple>
                <option value="">Select Language</option>
                <option value="HTML">HTML</option>
                <option value="CSS">CSS</option>
                <option value="JAVA SCRIPT">JAVA SCRIPT</option> 
                <option value="REACT">REACT</option>
                <option value="C">C</option>
                <option value="C++">C++</option>
                <option value="NODE JS">NODE JS</option>
                 </select>
                 <br><br>

                <label>Address:</label>
                <br>
                <textarea id="address" rows="4" cols="30"></textarea>
                <br><br> 

                <label>Date of Birth:</label> 
                <input type="date" id="dob">
                <br><br> 

                <label>Preferred Time:</label> 
                <input type="time" id="time"> 
                <br><br>


                <label>Programming Skills Level (0-10):</label>
                <input type="range" name="level" min="0" max="10">
                 <br><br>

                <label>Favourite Color:</label>
                <input type="color" id="color">
                <br><br>

                <label>Upload Resume:</label>
                <input type="file" id="resume" accept=".pdf,.doc,.docx">
                <br><br>


                <label>Portfolio URL:</label>
                <input type="url" id="portfolio">
                <br><br>

                <label>Search Topic:</label>
                <input type="search" id="searchTopic"> 
                <br><br>

                <input type="button" value="Read Form Values">
                <input type="reset" value="Reset">






        </form>
    </body>

    
</html>
