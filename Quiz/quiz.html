<!DOCTYPE html>
<html>
<head>
    <title>Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">

        <h1>Online Quiz</h1>

        <h3 id="question">Question will appear here</h3>

        <div id="options">
            <button class="option"></button>
            <button class="option"></button>
            <button class="option"></button>

            Restart Quiz
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
