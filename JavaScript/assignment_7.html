<!DOCTYPE html>
<html>
<head>
    <title>Identify Data Types</title>
</head>
<body>

    <h2>Identify Data Types in JavaScript</h2>
    <script>
        let marks = 85;
        let studentName = "Sakshi";
        let passed = true;
        console.log("Marks:", marks);
        console.log("Student Name:", studentName);
        console.log("Passed:", passed);

        
        console.log("Data type of marks:", typeof marks);
        console.log("Data type of studentName:", typeof studentName);
        console.log("Data type of passed:", typeof passed);
        alert("Data type of marks: " + typeof marks);
        alert("Data type of studentName: " + typeof studentName);
        alert("Data type of passed: " + typeof passed);
    </script>
</body>
</html>
